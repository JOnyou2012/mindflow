<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load fonts non-blocking: a slow/blocked fonts.googleapis.com must not
         stall first paint (render-blocking CSS does). Falls back to system
         fonts if the stylesheet never loads. -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    </noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MindFlow uses a mathematical model of your brain to predict mental burnout and build a personalized weekly study schedule that puts hard tasks when you're freshest. Free, no account needed." />
    <meta name="theme-color" content="#1669d4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e1f20" />
    <meta property="og:title" content="MindFlow — Smart Study Scheduler" />
    <meta property="og:description" content="Predict burnout before it happens. A personalized weekly study plan powered by a Markov-chain cognitive model." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MindFlow — Smart Study Scheduler" />
    <meta name="twitter:description" content="Predict burnout before it happens. A personalized weekly study plan powered by a Markov-chain cognitive model." />
    <!-- Google Identity Services — OAuth popup for Google Calendar sync.
         Loaded async so a blocked/slow accounts.google.com can never stall
         first paint; googleAuthCore polls for window.google and surfaces a
         readable error if it never arrives. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <title>MindFlow — Smart Study Scheduler</title>
    <!-- Blocking script: apply dark theme and language before first paint to
         prevent FOWT (flash of wrong theme) and wrong screen-reader language. -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('mindflow_theme');
          if (t === 'dark') document.documentElement.classList.add('dark');
          var l = localStorage.getItem('mindflow_lang');
          if (l) document.documentElement.lang = l;
          if (l === 'ar') document.documentElement.dir = 'rtl';
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <!--
      DIRECTION CONTRACT — MindFlow revamp (SEED: CANON:google-calendar, user-pinned via standing exit)
      THESIS: A study planner that reads like the calendar students already live in; refuses the dark,
        glow-accented "focus app" costume this category ships by default.
      OWN-WORLD: Google Calendar, played straight — white ground, #dadce0 hairlines, #1a73e8 primary,
        Roboto/system stack, solid event chips, circular date headers, quiet grays. Dark mode as a
        secondary theme in Google's dark register, never the default.
      STORY: The visitor is guided, not dumped: Calibrate → Schedule → Tasks → Plan, one phase per
        page, and the plan is a real week view they already know how to read.
      FIRST VIEWPORT: GCal-style app bar (mark + wordmark left, settings right), a four-step stepper,
        one focused task below; primary action is a blue pill at bottom right.
      FORM: wizard shell over a week-grid results page; category canon chosen explicitly by the user.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the
        verdict, and DESIGN.md.
    -->
    <div id="root"></div>
    <noscript>
      <div style="font-family:system-ui,sans-serif;max-width:400px;margin:80px auto;padding:20px;text-align:center">
        <h1 style="font-size:1.3rem;color:#202124">MindFlow</h1>
        <p style="color:#5f6368">MindFlow requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
